spring.application.name=videogames

# --- H2 in-memory database configuration ---
spring.datasource.url=jdbc:h2:mem:videogames;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensure Spring uses our SQL scripts for schema & data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.continue-on-error=true

# Let Hibernate use the existing schema (created by scripts)
spring.jpa.hibernate.ddl-auto=none

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Testing: keep using configured (H2) database
spring.test.database.replace=none

# Logging tweaks
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.main.banner-mode=off
logging.level.com.zaxxer.hikari=off
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl