<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="images/game.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/project/games.js" type="module"></script>
</head>

<body class="bg-warning-subtle" style="min-height: 100vh;">
<div class="container text-center py-5">

    <!-- Knoppen bovenaan -->
    <div class="d-flex gap-5 mb-4">
        <a href="index.html" class="btn btn-outline-info d-flex align-items-center">
            <img src="images/back.ico" alt="back" style="width:32px; height:32px; margin-right:0.5rem;">
            Kerekewere
        </a>
        <a href="nieuweGame.html" class="btn btn-primary d-flex align-items-center">Game toevoegen</a>
        <a href="consoles.html" class="btn btn-success d-flex align-items-center">Consoles</a>
    </div>

    <!-- Titel + totaal aantal games -->
    <h1 id="gamesTitel" class="mb-4 text-primary">Games</h1>
    <h6 class = text-secondary>(filters werken (nog) niet gelijktijdig)</h6>

    <!-- Filters -->
    <div class="d-flex gap-3 mb-4 justify-content-center">
        <input type="text" id="titleFilter" class="form-control w-25" placeholder="Zoek op titel...">
        <select id="genreFilter" class="form-select w-25">
            <option value="">Alle genres</option>
            <!-- JS vult hier de genres -->
        </select>
    </div>

    <!-- Games tabel -->
    <table class="table table-primary table-striped table-bordered">
        <thead class="table-secondary">
        <tr>
            <!--<th scope="col">#</th>-->
            <th scope="col" class="text-start">Titel</th>
            <th scope="col" class="text-start">Developer</th>
            <th scope="col">Releasedatum</th>
            <th scope="col" class="text-start">Genre</th>
            <th scope="col" class="bg-warning text-dark">Verwijderen</th>
        </tr>
        </thead>
        <tbody id="gamesBody">
        <!-- JS vult hier de rijen met GameBeknopt -->
        </tbody>
    </table>

    <div id="storing" class="text-bg-danger" hidden></div>
</div>
</body>
</html>
