<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="images/game.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/project/game.js" type="module"></script>
</head>
<body class="bg-warning-subtle" style="min-height: 100vh;">
<div class="container py-5">

    <!-- Knoppen bovenaan -->
    <div class="d-flex gap-5 mb-4">
        <a href="games.html" class="btn btn-outline-info d-flex align-items-center">
            <img src="images/back.ico" alt="back" style="width:32px; height:32px; margin-right:0.5rem;">
            Kerekewere
        </a>
        <a href ="consoleToevoegen.html" class="btn btn-success d-flex align-items-center">
            Game koppelen aan een console
        </a>
    </div>

    <!-- Game info -->
    <h2 id="gameTitel" class="text-primary"></h2>
    <p id="gameInfo"></p>

    <!-- Consoles tabel -->
    <table class="table table-success table-striped table-bordered mt-4">
        <thead class="table-secondary">
        <tr>
            <!--<th scope="col">#</th>-->
            <th scope="col">Naam</th>
            <th scope="col">Maker</th>
            <th scope="col">Releasejaar</th>
            <th scope="col" class="text-center text-bg-warning">Game niet meer op deze console?</th>
        </tr>
        </thead>
        <tbody id="consolesBody">
        <!-- Rijen worden door JS toegevoegd -->
        </tbody>
    </table>

    <div id="storing" class="text-bg-danger" hidden></div>

</div>
</body>
</html>
