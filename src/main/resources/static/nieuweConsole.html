<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Console toevoegen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="images/console.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/project/nieuweConsole.js" type="module"></script>
</head>
<body class="bg-warning-subtle" style="min-height: 100vh;">
<div class="container text-center py-5">
    <div class="d-flex gap-5 mb-4">
        <a href="consoles.html" class="btn btn-outline-info d-flex align-items-center">
            <img src="images/back.ico" alt="back" style="width:32px; height:32px; margin-right:0.5rem;">
            Kerekewere
        </a>
    </div>

    <h1 class="mb-4 text-success">Console toevoegen</h1>

    <form id="toevoegForm" class="d-flex flex-column align-items-center gap-3">
        <div class="w-50">
            <label for="naam" class="form-label">Naam:</label>
            <input type="text" id="naam" class="form-control" required autofocus>
            <div id="naamFout" class="fout form-text text-danger" hidden>Verplicht</div>
        </div>
        <div class="w-50">
            <label for="maker" class="form-label">Maker:</label>
            <input type="text" id="maker" class="form-control" required>
            <div id="makerFout" class="fout form-text text-danger" hidden>Verplicht</div>
        </div>
        <div class="w-50">
            <label for="releasejaar" class="form-label">Releasejaar:</label>
            <input type="number" id="releasejaar" class="form-control" required min="1970">
            <div id="releasejaarFout" class="fout form-text text-danger" hidden>Tussen 1970 en dit jaar</div>
        </div>
        <button type="submit" id="toevoegen" class="btn btn-success mt-3">Toevoegen</button>
        <div id="consoleBestaatAlFout" class="fout form-text text-danger" hidden>Console bestaat al</div>
    </form>
    <div id="storing" class="fout text-bg-danger" hidden>STORING</div>
</div>
</body>
</html>
